<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Interativo do Brasil</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--fg:#1f2933;--card:#fff;--muted:#6b7280;
--n:#2e8b6e;--ne:#e0a030;--co:#c8643c;--se:#4a6fa5;--s:#8a5fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191d;--fg:#eceae4;--card:#23272d;--muted:#9aa3ad;
--n:#3aa384;--ne:#c9922a;--co:#d4734a;--se:#5b82bb;--s:#9c72ba}}
:root[data-theme="dark"]{--bg:#16191d;--fg:#eceae4;--card:#23272d;--muted:#9aa3ad;--n:#3aa384;--ne:#c9922a;--co:#d4734a;--se:#5b82bb;--s:#9c72ba}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;padding:24px 16px 40px}
main{max-width:760px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem}
#map{display:block;width:100%;height:auto}
.e{stroke:var(--bg);stroke-width:1;stroke-linejoin:round;cursor:pointer;transition:filter .15s}
.e.n{fill:var(--n)}.e.ne{fill:var(--ne)}.e.co{fill:var(--co)}.e.se{fill:var(--se)}.e.s{fill:var(--s)}
.e:hover,.e:focus-visible{filter:brightness(1.25);outline:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;font:.85rem system-ui,sans-serif}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:4px 10px;border-radius:6px;font:.85rem system-ui,sans-serif;opacity:0;transition:opacity .1s;z-index:20}
dialog{border:0;border-radius:14px;padding:0;max-width:min(460px,92vw);background:var(--card);color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img{display:block;width:100%;height:min(52vh,380px);object-fit:contain;background:#111}
#nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 0 8px!important;font:.9rem system-ui,sans-serif}
#nav button{position:static;width:32px;height:32px}
dialog div{padding:16px 20px 20px}
dialog h2{margin:0 0 2px;font-size:1.3rem}
dialog small{color:var(--muted);font-family:system-ui,sans-serif}
dialog p{margin:10px 0 0;line-height:1.5}
dialog button{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.2rem;cursor:pointer}
</style>
</head>

    document.getElementById("dn").textContent=e[1];
